services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_NAME=${APP_NAME:-YouTube MCP by Nabux}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://youtube.nabuxai.com}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://youtube.nabuxai.com/youtube/callback}
      - GOOGLE_SCOPES=${GOOGLE_SCOPES:-https://www.googleapis.com/auth/youtube.readonly,https://www.googleapis.com/auth/youtube.upload,https://www.googleapis.com/auth/youtube.force-ssl,https://www.googleapis.com/auth/yt-analytics.readonly}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-60}
      - MAX_REMOTE_UPLOAD_MB=${MAX_REMOTE_UPLOAD_MB:-2048}
      - DATA_DIR=/data
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    volumes:
      - youtube-mcp-data:/data
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  youtube-mcp-data:
