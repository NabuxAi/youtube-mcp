name: X MCP CI
on:
  push:
    branches: [feature/x-mcp-gateway]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app server.py
      - name: Runtime wiring smoke
        env:
          DATA_DIR: /tmp/x-mcp-ci
          APP_SECRET_KEY: test-secret-that-is-long-enough-for-fernet-123456
          PUBLIC_BASE_URL: http://localhost:8000
          X_CLIENT_ID: test-client
          INTERNAL_SERVICE_TOKEN: internal-test-token
        run: python -c "from app import config; config.DATA_DIR.mkdir(parents=True,exist_ok=True); import server; server.build_app(); print('x runtime ok')"
      - name: Unit tests
        env:
          APP_SECRET_KEY: test-secret-that-is-long-enough-for-fernet-123456
          PUBLIC_BASE_URL: http://localhost:8000
          X_CLIENT_ID: test-client
          INTERNAL_SERVICE_TOKEN: internal-test-token
        run: pytest -q tests/test_x_gateway.py
